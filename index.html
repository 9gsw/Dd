<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم بالرسائل 💙</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background-color: #1e293b; padding: 30px; border-radius: 12px; width: 380px; text-align: center; }
        h2 { color: #38bdf8; }
        textarea { width: 100%; height: 120px; padding: 10px; border-radius: 8px; border: 1px solid #475569; background-color: #0f172a; color: #fff; box-sizing: border-box; margin-bottom: 15px; resize: none; font-size: 15px; }
        button { background-color: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #0369a1; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>إرسال رسالة للسيرفر 💙</h2>
        <textarea id="message" placeholder="اكتب رسالتك هنا يا عبود..."></textarea>
        <button onclick="sendMessage()">إرسال الرسالة</button>
        <div id="status"></div>
    </div>

    <script>
        const WEBHOOK_URL = "ضع_رابط_الـWEBHOOK_هنا";

        async function sendMessage() {
            const msg = document.getElementById('message').value;
            const statusDiv = document.getElementById('status');

            if (!msg) {
                statusDiv.innerText = "الرجاء كتابة رسالة أولاً!";
                statusDiv.style.color = "#ef4444";
                return;
            }

            statusDiv.innerText = "جاري الإرسال...";
            statusDiv.style.color = "#38bdf8";

            try {
                const res = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: msg })
                });

                if (res.ok) {
                    statusDiv.innerText = "تم الإرسال بنجاح! 💙";
                    statusDiv.style.color = "#4ade80";
                    document.getElementById('message').value = "";
                } else {
                    statusDiv.innerText = "فشل الإرسال، تأكد من رابط Webhook.";
                    statusDiv.style.color = "#ef4444";
                }
            } catch (err) {
                statusDiv.innerText = "حدث خطأ أثناء الاتصال.";
                statusDiv.style.color = "#ef4444";
            }
        }
    </script>
</body>
</html>
